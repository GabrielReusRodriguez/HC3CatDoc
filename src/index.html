<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor del catàleg de documents HC3 de Catsalut</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Visor del catàleg de documents HC3 de Catsalut</h1>
        <div class="controls">
            <div class="control-group">
                <label for="fileInput">Seleccionar fitxer CSV:</label>
                <input type="file" id="fileInput" accept=".csv">
            </div>
            <div class="control-group">
                <label for="search-input">Cercar:</label>
                <input type="text" id="search-input" placeholder="Cercar...">
            </div>
            <div class="control-group">
                <label for="rowsPerPage">Files per pàgina:</label>
                <select id="rowsPerPage">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
            <div class="control-group">
                <button id="clear-filters" onclick="clearFilters()">Netejar filtres</button>
            </div>
        </div>
        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">Codi tipus document</th>
                        <th onclick="sortTable(1)">Nom tipus document</th>
                        <th onclick="sortTable(2)">Agrupador</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
        <div class="pagination">
            <button id="prevPage" onclick="previousPage()">Anterior</button>
            <span id="pageInfo">Pàgina 1 de 1</span>
            <button id="nextPage" onclick="nextPage()">Següent</button>
        </div>
        <footer>
            <p>Made with ❤ in Barcelona by grr[at]gabrielreus[dot]es and some AI assistance</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
